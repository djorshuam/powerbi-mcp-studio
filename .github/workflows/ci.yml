name: CI
on: [push, pull_request]
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Compilar scripts Python
        run: python -m py_compile skills/powerbi-mcp-studio/scripts/*.py
      - name: Testar instalador
        run: node bin/install.js --projeto && test -f .claude/skills/powerbi-mcp-studio/SKILL.md
      - name: Validar manifestos JSON
        run: python -c "import json;[json.load(open(f)) for f in ['package.json','.claude-plugin/plugin.json','.claude-plugin/marketplace.json']]"
